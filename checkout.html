<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoDrive | Proceso de Pago</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            <h1>Auto<span>Drive</span></h1>
        </div>
        <nav class="nav">
            <a href="index.html">Catálogo</a>
            <a href="Compras.html">Reservas</a>
            <a href="checkout.html" class="active">Separar Auto</a>
            <a href="contacto.html">Contacto</a>
            <a href="registro.html">Registro</a>
        </nav>
    </header>

    <main class="container page-content">
        <h2>Formulario de Separación y Pago</h2>
        
        <form class="form-card" onsubmit="event.preventDefault(); alert('¡Reserva procesada con éxito!');">
            <h3>Datos del Comprador</h3>
            <div class="form-group">
                <label>Nombre Completo:</label>
                <input type="text" placeholder="Ej. Juan Pérez" required>
            </div>
            <div class="form-group">
                <label>DNI / Documento de Identidad:</label>
                <input type="text" placeholder="8 dígitos" required>
            </div>
            <div class="form-group">
                <label>Correo Electrónico:</label>
                <input type="email" placeholder="correo@ejemplo.com" required>
            </div>

            <h3>Datos de Pago</h3>
            <div class="form-group">
                <label>Número de Tarjeta:</label>
                <input type="text" placeholder="**** **** **** ****" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Fecha Exp.:</label>
                    <input type="text" placeholder="MM/AA" required>
                </div>
                <div class="form-group">
                    <label>CVV:</label>
                    <input type="password" placeholder="123" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Confirmar Resera ($ 1,000.00)</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 AutoDrive - Universidad de Ciencias y Humanidades (UCH)</p>
    </footer>

</body>
</html>
